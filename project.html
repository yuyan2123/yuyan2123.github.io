<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<script>
(function () {
  var root = document.documentElement;
  var theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  var themeSource = "system";
  var language = "zh";
  try {
    var saved = localStorage.getItem("pf-theme");
    if (saved === "dark" || saved === "light") {
      theme = saved;
      themeSource = "user";
    }
    var savedLanguage = localStorage.getItem("pf-lang");
    if (savedLanguage === "en" || savedLanguage === "zh") language = savedLanguage;
  } catch (_) {}
  root.setAttribute("data-theme", theme);
  root.setAttribute("data-theme-source", themeSource);
  root.style.colorScheme = theme;
  var markupLanguage = root.lang === "en" ? "en" : "zh";
  if (markupLanguage !== language) root.setAttribute("data-language-pending", "");
  root.lang = language === "en" ? "en" : "zh-Hant";
})();
</script>
<style id="theme-paint">
:root { --color-paper: oklch(98.5% 0.005 260); }
html[data-theme="dark"] { --color-paper: oklch(17% .014 260); }
html { background: var(--color-paper); }
/* Only show a restored language after its text and dynamic content agree. */
html[data-language-pending] body { visibility: hidden; }
</style>
